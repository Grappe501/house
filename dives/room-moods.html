<h2>Room moods</h2>
<p>Mood is the quiet language of the House.</p>
<ul>
  <li><strong>Light</strong> changes what the reader expects.</li>
  <li><strong>Warmth</strong> changes what the reader trusts.</li>
  <li><strong>Geometry</strong> changes what the reader feels in their body.</li>
</ul>
<p>We never announce this. The reader feels it.</p>
