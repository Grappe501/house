<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>The House We Live In — Reader</title>
  <link rel="stylesheet" href="/assets/css/house-reader.css" />
</head>
<body class="reduce-motion-off">
  <header class="hr-header">
    <button class="hr-btn" id="btnMap" aria-label="Open House Map">Map</button>
    <div class="hr-title">
      <div class="hr-book">The House We Live In</div>
      <div class="hr-room" id="roomLabel">Room 001</div>
    </div>
    <div class="hr-actions">
      <button class="hr-btn" id="btnBookmark" aria-label="Bookmark this Room">Bookmark</button>
      <button class="hr-btn" id="btnNotes" aria-label="Toggle Notes">Notes</button>
      <button class="hr-btn" id="btnAudio" aria-label="Audio">Listen</button>
    </div>
  </header>

  <main class="hr-main" id="main">
    <section class="hr-page" id="page" aria-live="polite">
      <article class="hr-text" id="roomContent"></article>

      <aside class="hr-margin" id="notesPane" hidden>
        <div class="hr-pane-title">Margin Notes</div>
        <textarea id="notesField" placeholder="Write here… (saved automatically)"></textarea>
        <div class="hr-pane-actions">
          <button class="hr-btn hr-btn-small" id="btnExportNotes">Export (v2)</button>
          <button class="hr-btn hr-btn-small" id="btnClearNotes">Clear</button>
        </div>
      </aside>
    </section>

    <nav class="hr-nav" aria-label="Room navigation">
      <button class="hr-nav-btn" id="prevBtn" aria-label="Previous Room">‹</button>
      <button class="hr-nav-btn" id="nextBtn" aria-label="Next Room">›</button>
    </nav>
  </main>

  <!-- House Map Drawer -->
  <div class="hr-drawer" id="mapDrawer" hidden>
    <div class="hr-drawer-header">
      <div class="hr-drawer-title">House Map</div>
      <button class="hr-btn" id="btnCloseMap" aria-label="Close Map">Close</button>
    </div>
    <div class="hr-drawer-body" id="mapList"></div>
  </div>

  <!-- Glossary Bubble -->
  <div class="hr-bubble" id="bubble" hidden></div>

  <!-- Audio Panel -->
  <div class="hr-audio" id="audioPanel" hidden>
    <div class="hr-audio-row">
      <div class="hr-audio-title">Listen</div>
      <button class="hr-btn" id="btnCloseAudio">Close</button>
    </div>
    <audio id="audio" controls preload="none"></audio>
    <div class="hr-audio-hint">
      v1: attach per-room audio files via the manifest. Read-along highlighting is a placeholder.
    </div>
  </div>

  <script src="/assets/js/house-reader.js"></script>
</body>
</html>
