<h2>What is a Room?</h2>
<p>A <strong>Room</strong> is one page with a job: an emotional container designed to carry a single state.</p>
<p>In print, Rooms are built with whitespace and geometry. Online, Rooms can include notes, audio, and deeper layers.</p>
